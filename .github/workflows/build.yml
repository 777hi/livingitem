name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

  # 用 gradle.properties 声明的 NeoForge 下限编译 + 跑测试。
  # ⚠️ 调 neo_min_version 前，先本地跑通 `./gradlew test -Pneo_version=<新值>`。
  compat-floor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read declared NeoForge floor
        id: floor
        shell: bash
        run: echo "version=$(grep -m1 '^neo_min_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Compile + test against declared NeoForge floor
        run: ./gradlew test "-Pneo_version=${{ steps.floor.outputs.version }}"