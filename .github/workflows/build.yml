name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 换 NeoForge 版本时，缓存里还留着旧版本的 patched MC jar ⇒ 编译会拿旧产物配新 jar，
      # 报出莫名其妙的「找不到某个类」（2026-10-21 实测：219 的 NeoForge jar 配上了缓存里
      # 249 的 patched MC jar ⇒ 「找不到 TooltipFlagExtension」，而 219 根本没这个类）。
      # 版本变了就清一次产物缓存自愈；版本没变则不动（保持增量快）。
      - name: Drop stale build artifacts if NeoForge version changed
        shell: bash
        run: |
          ver=$(grep -m1 '^neo_version=' gradle.properties | cut -d= -f2)
          root="$HOME/.gradle/caches"
          marker="$root/neoformruntime/.neo-version"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$ver" ]; then
            echo "NeoForge $ver: dropping stale artifacts"
            rm -rf "$root/neoformruntime/intermediate_results" "$root/build-cache-1"
          fi
          mkdir -p "$root/neoformruntime"
          echo "$ver" > "$marker"

      # 编译用的 NeoForge 版本 == 对外声明的最低版本（gradle.properties 的 neo_version，
      # mods.toml 的 versionRange 也用它）⇒ 这一步跑通 = 兼容承诺成立。
      - name: Build with Gradle
        run: ./gradlew build
