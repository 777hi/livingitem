# 构建指纹 —— 实际值由 Gradle 的 generateBuildProps 任务注入（见 build.gradle）。
# 运行时主类启动时打印一行，供崩溃报告/日志自证构建版本：
# 报错符号名与源码对不上（如出现改名前的旧名）⇒ 先怀疑跑的是旧构建产物。
# ⚠️ 本文件在 src/main/build-props/（模板目录），不在 src/main/resources/ ——
#    占位符写法是 build.commit / build.time 两行（模板引擎会展开所有花括号引用，
#    注释里不要出现花括号引用）；未走 Gradle 注入时兜底显示 unknown。
build.commit=${commit}
build.time=${buildTime}
